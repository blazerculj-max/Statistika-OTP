name: Update 3x3 Državc

# Teče SAMO na dneve turnirjev, vsakih 10 minut, v oknu 08:00–22:00 CEST.
# CEST = UTC+2, zato so ure v UTC zamaknjene za -2 (06:00–20:00 UTC).
#
# KAKO DODATI NOV DAN TURNIRJA:
#   Dodaj novo cron vrstico z datumom turnirja. Cron nima "datuma" v enem polju,
#   zato uporabimo dan-v-mesecu + mesec. Primer za 30. maj:  '*/10 6-20 30 5 *'
#   (vsakih 10 min, ure 6-20 UTC, dan 30, mesec 5).
#   Za 21. junij dodaj:  '*/10 6-20 21 6 *'
#
# Lahko tudi ročno sprožiš prek "Run workflow" (workflow_dispatch).

on:
  workflow_dispatch:        # ročni zagon kadarkoli
  schedule:
    # Državc Škofja Loka — 30. maj 2026
    - cron: '*/10 6-20 30 5 *'
    # Državc Vrhnika — DODAJ datum, ko bo znan (npr. '*/10 6-20 21 6 *')
    # - cron: '*/10 6-20 21 6 *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch 3x3 data
        run: python scripts/fetch_3x3.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/drzavc_3x3.json)" ]; then
            git add data/drzavc_3x3.json
            git commit -m "3x3: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✓ pushano"
          else
            echo "= ni sprememb"
          fi
