name: Posodobi mladince (SI)

# Mladinske lige se osvezujejo redkeje kot clanske, zato tedensko.
# Skript sam odkrije ID-je tekmovanj za tekoco sezono (kategorija + rang + tip),
# zato ob novi sezoni tu ni nicesar za spreminjati.
on:
  schedule:
    - cron: '0 3 * * 2'      # vsak torek ob 3:00 UTC
  workflow_dispatch:
    inputs:
      ages:
        description: 'Starosti (u18,u16,u14) — prazno = vse'
        required: false
        default: ''
        type: string
      ranks:
        description: 'Rangi (1.A,1.B,2.) — prazno = vsi. Samo 1.A je hitro.'
        required: false
        default: ''
        type: string
      season:
        description: 'SeasonId — prazno = samodejno'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  fetch-mladi:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # poln zajem vseh starosti in rangov je ~2400 tekem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch mladinske lige
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.ages }}" ]   && ARGS="$ARGS --ages ${{ github.event.inputs.ages }}"
          [ -n "${{ github.event.inputs.ranks }}" ]  && ARGS="$ARGS --ranks ${{ github.event.inputs.ranks }}"
          [ -n "${{ github.event.inputs.season }}" ] && ARGS="$ARGS --season ${{ github.event.inputs.season }}"
          python scripts/fetch_mladi.py $ARGS

      - name: Commit in push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/mladi_*.json
          git diff --staged --quiet || git commit -m "Mladi: posodobi podatke $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash || true
          git push
